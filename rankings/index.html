<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ranking charts</title><style>
body {
  background: #f6f8fb;
  color: #172033;
  font: 16px/1.5 system-ui, sans-serif;
  margin: 0;
}

main {
  margin: auto;
  max-width: 1440px;
  padding: 2rem;
}

h1 {
  margin-bottom: .15rem;
}

.subtitle {
  color: #5c6577;
  margin-top: 0;
}

.site-nav {
  margin-bottom: 1.5rem;
}

.nav-link {
  background: #2855b8;
  border-radius: .5rem;
  color: #fff;
  display: inline-block;
  font-size: .875rem;
  font-weight: 700;
  padding: .45rem .9rem;
}

.nav-link:hover,
.nav-link:focus-visible {
  background: #173676;
}


.category {
  margin-top: 2.5rem;
}

.comparisons {
  display: grid;
  gap: 1.25rem;
}

article {
  background: #fff;
  border: 1px solid #dce1eb;
  border-radius: .75rem;
  overflow: hidden;
  box-shadow: 0 2px 5px #1720330d;
}

article h3 {
  font-size: 1rem;
  margin: 0;
  padding: .8rem 1rem;
}

.variants {
  display: grid;
  gap: 1px;
  background: #dce1eb;
}

figure {
  background: #fff;
  margin: 0;
  min-width: 0;
  padding: .75rem;
  display: flex;
  flex-direction: column;
  gap: .75rem;
}

figcaption {
  display: flex;
  align-items: center;
  gap: .5rem;
  color: #5c6577;
  font-size: .875rem;
  font-weight: 700;
}

.figure-label {
  flex: 1 1 auto;
  color: #172033;
}

.figure-download {
  flex: 0 0 auto;
  color: #2855b8;
  font-size: .75rem;
  font-weight: 700;
  text-decoration: underline;
}

.expand-button {
  background: #fff;
  border: 0;
  color: inherit;
  cursor: zoom-in;
  display: block;
  font: inherit;
  margin: 0;
  padding: 0;
  text-align: left;
  width: 100%;
}

.expand-button:focus {
  outline: none;
}

.expand-button:hover .chart-image,
.expand-button:focus-visible .chart-image {
  outline: 2px solid #2855b8;
  outline-offset: 2px;
}

.chart-image {
  display: block;
  height: auto;
  width: 100%;
}

.missing {
  background: #fff;
  color: #70798a;
  display: grid;
  margin: 0;
  min-height: 10rem;
  min-width: 0;
  padding: .75rem;
  place-items: center;
  text-align: center;
}

a {
  color: inherit;
  text-decoration: none;
}

a.figure-download {
  color: #2855b8;
  text-decoration: underline;
}

body.lightbox-open {
  overflow: hidden;
}

@media (max-width: 760px) {
  .variants {
    grid-template-columns: 1fr !important;
  }

  main {
    padding: 1rem;
  }
}

.lightbox {
  align-items: center;
  background: rgba(12, 17, 28, .86);
  display: none;
  inset: 0;
  justify-content: center;
  padding: 1rem;
  position: fixed;
  z-index: 1000;
}

.lightbox.open {
  display: flex;
}

.lightbox-content {
  background: #fff;
  border-radius: .75rem;
  box-shadow: 0 20px 50px #0b122166;
  display: flex;
  flex-direction: column;
  height: min(94vh, 1600px);
  max-height: 94vh;
  max-width: 96vw;
  overflow: hidden;
  width: min(96vw, 2200px);
}

.lightbox-header {
  align-items: center;
  border-bottom: 1px solid #dce1eb;
  display: flex;
  flex: 0 0 auto;
  gap: .75rem;
  padding: .75rem 1rem;
}

#lightbox-caption {
  color: #172033;
  flex: 1 1 auto;
  font-weight: 700;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.lightbox-toolbar {
  display: flex;
  flex: 0 0 auto;
  flex-wrap: wrap;
  gap: .5rem;
  margin-left: auto;
}

.lightbox-button {
  appearance: none;
  background: #fff;
  border: 1px solid #cfd6e4;
  border-radius: .5rem;
  color: #172033;
  cursor: pointer;
  font: inherit;
  line-height: 1.2;
  padding: .4rem .7rem;
  text-decoration: none;
  white-space: nowrap;
}

.lightbox-button:hover,
.lightbox-button:focus-visible {
  border-color: #2855b8;
  color: #173676;
  background: #eef3ff;
}

.lightbox-close {
  font-size: 1.2rem;
  line-height: 1;
  padding-inline: .65rem;
}

.lightbox-body {
  background: #fff;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: 1rem;
}

.lightbox-image {
  display: block;
  margin: 0 auto;
}

@media (max-width: 760px) {
  .lightbox {
    padding: 0;
  }

  .lightbox-content {
    border-radius: 0;
    height: 100vh;
    max-height: 100vh;
    max-width: 100vw;
    width: 100vw;
  }

  .lightbox-header {
    flex-wrap: wrap;
  }

  .lightbox-toolbar {
    width: 100%;
  }

  #lightbox-caption {
    width: 100%;
  }
}
</style></head><body><main><h1>Ranking chart comparison</h1><nav class="site-nav"><a class="nav-link" href="../index.html">← Comparison charts</a></nav><p class="subtitle">2 ranking chart(s) across 1 category.</p><section class="category"><h2>ranking_plots</h2><div class="comparisons"><article><h3>fir mutations</h3><div class="variants" style="grid-template-columns: minmax(0, 1fr);"><figure><figcaption><span class="figure-label">fir mutations</span><a class="figure-download" href="assets/ranking_plots/fir_mutations.png" download>Download</a></figcaption><button type="button" class="expand-button" data-src="assets/ranking_plots/fir_mutations.png" data-alt="fir mutations ranking" data-caption="ranking_plots · fir mutations ranking" aria-label="Expand chart fir mutations"><img class="chart-image" src="assets/ranking_plots/fir_mutations.png" alt="fir mutations ranking" loading="lazy"></button></figure></div></article><article><h3>operations mutations</h3><div class="variants" style="grid-template-columns: minmax(0, 1fr);"><figure><figcaption><span class="figure-label">operations mutations</span><a class="figure-download" href="assets/ranking_plots/operations_mutations.png" download>Download</a></figcaption><button type="button" class="expand-button" data-src="assets/ranking_plots/operations_mutations.png" data-alt="operations mutations ranking" data-caption="ranking_plots · operations mutations ranking" aria-label="Expand chart operations mutations"><img class="chart-image" src="assets/ranking_plots/operations_mutations.png" alt="operations mutations ranking" loading="lazy"></button></figure></div></article></div></section>
<div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Expanded chart">
  <div class="lightbox-content" role="document">
    <div class="lightbox-header">
      <div id="lightbox-caption" aria-live="polite"></div>
      <div class="lightbox-toolbar">
        <button id="lightbox-prev" class="lightbox-button" type="button">Previous</button>
        <button id="lightbox-next" class="lightbox-button" type="button">Next</button>
        <a id="lightbox-download" class="lightbox-button" href="#" download="chart.png">Download PNG</a>
        <button id="lightbox-close" class="lightbox-button lightbox-close" type="button" aria-label="Close">×</button>
      </div>
    </div>
    <div class="lightbox-body">
      <img id="lightbox-image" class="lightbox-image" alt="">
    </div>
  </div>
</div>
<script>
(() => {
  const lightbox = document.getElementById("lightbox");
  if (!lightbox) return;

  const closeBtn = document.getElementById("lightbox-close");
  const prevBtn = document.getElementById("lightbox-prev");
  const nextBtn = document.getElementById("lightbox-next");
  const image = document.getElementById("lightbox-image");
  const caption = document.getElementById("lightbox-caption");
  const downloadLink = document.getElementById("lightbox-download");
  const buttons = Array.from(document.querySelectorAll(".expand-button"));

  if (!buttons.length) return;

  let currentIndex = -1;
  let lastFocused = null;

  function fileNameFromPath(path) {
    const clean = (path || "chart.png").split("?")[0].split("#")[0];
    const parts = clean.split("/");
    return parts[parts.length - 1] || "chart.png";
  }

  function show(index) {
    currentIndex = (index + buttons.length) % buttons.length;
    const button = buttons[currentIndex];

    const src = button.getAttribute("data-src") || "";
    const alt = button.getAttribute("data-alt") || "Chart";
    const cap = button.getAttribute("data-caption") || "";

    image.src = src;
    image.alt = alt;
    caption.textContent = cap;

    downloadLink.href = src;
    downloadLink.setAttribute("download", fileNameFromPath(src));

    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.classList.add("lightbox-open");

    if (closeBtn) closeBtn.focus();
  }

  function close() {
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.classList.remove("lightbox-open");

    image.removeAttribute("src");
    image.removeAttribute("alt");

    if (lastFocused) lastFocused.focus();
    currentIndex = -1;
  }

  buttons.forEach((button, i) => {
    button.addEventListener("click", () => {
      lastFocused = button;
      show(i);
    });
  });

  if (closeBtn) closeBtn.addEventListener("click", close);
  if (prevBtn) prevBtn.addEventListener("click", () => show(currentIndex - 1));
  if (nextBtn) nextBtn.addEventListener("click", () => show(currentIndex + 1));

  lightbox.addEventListener("click", (event) => {
    if (event.target === lightbox) close();
  });

  document.addEventListener("keydown", (event) => {
    if (!lightbox.classList.contains("open")) return;

    if (event.key === "Escape") {
      close();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      show(currentIndex - 1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      show(currentIndex + 1);
    }
  });
})();
</script></main></body></html>
